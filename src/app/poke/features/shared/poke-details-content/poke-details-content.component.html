@if (detail(); as d) {
  <div class="dn-content">
    <div class="dn-art">
      <img [src]="d.artworkUrl" [alt]="data().name" />
    </div>

    <div class="dn-chips">
      @for (t of d.types; track t) {
        <app-custom-chip [label]="t" [color]="typeColor(t)" />
      }
    </div>

    <app-details-sections [sections]="sections()" />

    @if (owned(); as p) {
      <section class="dn-training">
        <h4>Training</h4>
        <div class="dn-xp">
          <div class="dn-xp-bar" [style.width.%]="xpPct()"></div>
        </div>
        <div class="dn-xp-label">
          Lv. {{ p.level }} · {{ p.xp }} / {{ xpNeed() }} XP
          <span class="dn-xp-pct">({{ xpPct() }}%)</span>
        </div>
      </section>
    }
  </div>
} @else {
  <div class="dn-loading">
    <mat-spinner [diameter]="32" />
  </div>
}
